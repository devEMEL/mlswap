specVersion: 0.0.4
description: Indexes ERC1155 points minted by the PointsHook contract on Arc.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: PointsHook
    network: arc
    source:
      address: "0x759ebc7a9d4236a207cd5ade79d00a02c37bc040"
      abi: PointsHook
      startBlock: 23934387
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/pointsHook.ts
      entities:
        - PointsBalance
        - PointsTransfer
      abis:
        - name: PointsHook
          file: ./abis/PointsHook.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle